name: Validate Nastor Studio
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/producer-daw-workbench]
permissions:
  contents: read
jobs:
  typecheck-lint-build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
