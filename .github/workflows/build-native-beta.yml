name: Build Native Beta Apps

on:
  push:
    branches: [feat/producer-collab-daw-redesign]
    paths:
      - 'desktop/**'
      - 'android/**'
      - '.github/workflows/build-native-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows EXE (unsigned beta)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Electron builder dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build EXE installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run pack:win
      - name: Upload Windows beta installer
        uses: actions/upload-artifact@v4
        with:
          name: Nastor-AI-Studio-Windows-EXE-Beta
          path: desktop/dist/*.exe
          retention-days: 14
          if-no-files-found: error

  android-debug-apk:
    name: Android APK (debug-signed beta)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload Android beta APK
        uses: actions/upload-artifact@v4
        with:
          name: Nastor-AI-Studio-Android-APK-Beta
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
