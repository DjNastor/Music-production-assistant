name: Package Nastor AI Studio (beta)

on:
  push:
    branches: [feat/native-installers-beta]
    paths:
      - "packaging/**"
      - "app/manifest.ts"
      - "app/icons/**"
      - ".github/workflows/packaging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE (unsigned beta)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Electron packaging dependencies
        working-directory: packaging/windows
        run: npm install --no-audit --no-fund
      - name: Build EXE packages
        working-directory: packaging/windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: nastor-windows-exe-beta
          path: packaging/windows/dist/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK (debug beta)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle -p packaging/android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nastor-android-apk-beta
          path: packaging/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
