<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nastor AI Studio • Offline</title>
  <style>
    body{margin:0;background:#0d0e10;color:#eee8dd;font:16px/1.6 system-ui,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center}
    main{max-width:480px;padding:40px;border:1px solid #4b4335;border-radius:18px;background:#1a1d22;text-align:center}
    h1{font-size:25px;margin:0 0 12px}p{color:#bcb5ad}
    a{display:inline-block;background:#e8bc74;color:#1b1a19;font-weight:700;padding:12px 21px;border-radius:8px;text-decoration:none;margin-top:12px}
    a:focus-visible{outline:3px solid white;outline-offset:3px}
  </style>
</head>
<body><main>
  <h1>Studio connection unavailable</h1>
  <p>Nastor AI Studio needs internet access for this version. Check your connection and open the studio again. No project files have been deleted.</p>
  <a href="https://nastor-ai-studio.vercel.app/">Retry studio</a>
</main></body></html>
