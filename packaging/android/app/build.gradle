plugins { id 'com.android.application' }
def studioUrl = System.getenv('NASTOR_APP_URL') ?: 'https://nastor-ai-studio.vercel.app'
android {
    namespace 'za.co.lukulu.nastoraistudio'
    compileSdk 35
    defaultConfig {
        applicationId 'za.co.lukulu.nastoraistudio'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'STUDIO_URL', '"' + studioUrl.replace('"','') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
