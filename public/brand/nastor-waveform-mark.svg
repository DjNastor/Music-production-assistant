    <rect x="52" y="10" width="32" height="240" rx="16" fill="url(#nastorOrange)"/>
    <rect x="104" y="90" width="32" height="80" rx="16" fill="#4A4E58"/>
    <rect x="156" y="10" width="32" height="240" rx="16" fill="url(#nastorOrange)"/>
    <rect x="208" y="40" width="32" height="180" rx="16" fill="url(#nastorOrange)"/>

    <!-- AI Copilot Spark Accent -->
    <path d="M 260 30 Q 260 55 285 55 Q 260 55 260 80 Q 260 55 235 55 Q 260 55 260 30 Z" fill="#FFC043"/>
