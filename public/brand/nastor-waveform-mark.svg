      <stop offset="0%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#E05600" />
    </linearGradient>
    <linearGradient id="glowEffect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9500" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF9500" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Dark Background -->
