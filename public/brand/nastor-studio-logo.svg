<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Gold/Amber Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="500" height="120" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Logo Mark Group -->
  <g transform="translate(24, 20)">
    <!-- Outer Icon Badge -->
    <rect width="80" height="80" rx="20" fill="#0B0E14" stroke="#F59E0B" stroke-width="2"/>

    <!-- Equalizer / Sound Wave Graphic behind Avatar Silhouette -->
    <g transform="translate(15, 25)" fill="url(#amberGrad)">
      <rect x="0" y="10" width="4" height="20" rx="2"/>
      <rect x="8" y="0" width="4" height="40" rx="2"/>
      <rect x="16" y="5" width="4" height="30" rx="2"/>
      <rect x="24" y="15" width="4" height="10" rx="2"/>
      <rect x="32" y="2" width="4" height="36" rx="2"/>
      <rect x="40" y="8" width="4" height="24" rx="2"/>
      <rect x="48" y="0" width="4" height="40" rx="2"/>
    </g>

    <!-- Simplified Headset / Assistant Ring Overlay -->
    <path d="M 22 36 A 20 20 0 0 1 58 36" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="20" cy="38" r="4" fill="#F59E0B"/>
    <circle cx="60" cy="38" r="4" fill="#F59E0B"/>
  </g>

  <!-- Brand Typography -->
  <!-- Main Title -->
  <text x="124" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#FFFFFF" letter-spacing="2">
    NASTOR
  </text>
  
  <!-- Accent Wave Dots next to text -->
  <circle cx="270" cy="48" r="4" fill="#F59E0B"/>

  <!-- Subtitle -->
  <text x="125" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#94A3B8" letter-spacing="3">
    MUSIC PRODUCTION ASSISTANT
  </text>

  <!-- Status / Accent Badge -->
  <g transform="translate(390, 48)">
    <rect width="70" height="22" rx="11" fill="#1E293B"/>
    <circle cx="12" cy="11" r="4" fill="#22C55E"/>
    <text x="22" y="15" font-family="sans-serif" font-weight="700" font-size="9" fill="#22C55E" letter-spacing="1">STUDIO</text>
  </g>
</svg>
